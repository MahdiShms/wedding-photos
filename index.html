<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>معرض صور الزفاف | Wedding Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f4f0;
      --surface: #ffffff;
      --surface-2: #efece6;
      --text: #181615;
      --muted: #66615b;
      --accent: #181615;
      --accent-hover: #2f2b28;
      --accent-text: #ffffff;
      --border: #e4dfd7;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 8px 24px rgba(24, 22, 21, 0.05);
      --card-min: 225px;
      --img-h: 235px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: "Cairo", "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
    }

    html[lang="en"] body {
      font-family: "Plus Jakarta Sans", "Cairo", system-ui, -apple-system, sans-serif;
    }

    .app-shell {
      max-width: 1260px;
      margin: 0 auto;
      padding: 14px 14px calc(92px + env(safe-area-inset-bottom));
    }

    /* Header: Left controls in fixed LTR row, Title centered, Right spacer balances width */
    header.topbar {
      position: sticky;
      top: 10px;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(215px, auto) 1fr minmax(215px, auto);
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      box-shadow: var(--shadow);
    }

    /* Keep left-side controls anchored on the physical left even in RTL */
    .header-left {
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: start;
    }

    .lang-slot {
      width: 78px;
      flex-shrink: 0;
    }

    .search-slot {
      width: 142px;
      flex-shrink: 0;
    }

    .header-center {
      text-align: center;
      min-width: 0;
    }

    .header-center h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2.2vw, 1.45rem);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-center p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right-spacer {
      justify-self: end;
      min-width: 1px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-2);
      border-color: #cfc8bd;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .lang-btn {
      width: 100%;
      padding: 0 8px;
      font-size: 0.82rem;
    }

    .search-btn {
      width: 100%;
      padding: 0 12px;
      font-size: 0.84rem;
    }

    /* Toolbar: Grid size locked on physical left, actions & status on right */
    .toolbar {
      direction: ltr;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      min-height: 56px;
    }

    .size-group {
      display: inline-grid;
      grid-template-columns: repeat(3, 66px);
      background: var(--surface-2);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .size-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      height: 30px;
      border-radius: 999px;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .toolbar-right {
      direction: inherit;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .badge-pill {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      white-space: nowrap;
    }

    .pill-btn {
      height: 34px;
      padding: 0 12px;
      font-size: 0.82rem;
    }

    .status-line {
      margin-top: 10px;
      padding-inline: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 20px;
    }

    /* Display sizes */
    body.size-small {
      --card-min: 155px;
      --img-h: 165px;
    }

    body.size-medium {
      --card-min: 225px;
      --img-h: 235px;
    }

    body.size-large {
      --card-min: 325px;
      --img-h: 330px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .card-media {
      position: relative;
      width: 100%;
      height: var(--img-h);
      background: var(--surface-2);
      overflow: hidden;
    }

    /* Focus upper half so faces are clearly framed */
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    .select-check {
      position: absolute;
      top: 8px;
      inset-inline-start: 8px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(24, 22, 21, 0.55);
      backdrop-filter: blur(6px);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .card.selected .select-check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      justify-content: space-between;
    }

    .card-name {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }

    .card-dl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .card-dl:hover {
      background: var(--accent-hover);
    }

    .card-view {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 9px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 44px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-top: 12px;
      color: var(--muted);
    }

    /* Mobile bottom bar */
    .mobile-dock {
      display: none;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 16, 15, 0.58);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: 1.18rem;
      padding-inline-end: 36px;
    }

    .modal p {
      margin: 0 0 16px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      inset-inline-end: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 1.15rem;
      cursor: pointer;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .choice-card {
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      background: var(--bg);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .choice-card:hover {
      border-color: var(--accent);
      background: var(--surface-2);
    }

    .choice-card strong {
      display: block;
      font-size: 0.94rem;
      margin-bottom: 3px;
    }

    .choice-card span {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .preview-box {
      display: none;
      text-align: center;
      margin-bottom: 14px;
    }

    .preview-box.has-img {
      display: block;
    }

    .preview-box img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      border: 3px solid var(--border);
      margin-bottom: 6px;
    }

    .modal-status {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 14px;
      min-height: 20px;
    }

    .modal-footer {
      display: grid;
      grid-template-columns: 1fr 1.4fr
